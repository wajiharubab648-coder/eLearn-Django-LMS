{% extends 'base.html' %}

{% block content %}
<div class="container py-5 text-center" style="margin-top: 120px; margin-bottom: 80px;">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm p-5" style="border-radius: 12px;">
                <h3 class="font-weight-bold text-success mb-3">Check Your Inbox</h3>
                <p class="text-muted">We have emailed you instructions for setting your password. If an account exists with the email you entered, you should receive it shortly.</p>
                <a href="{% url 'login' %}" class="btn btn-outline-primary mt-3 font-weight-bold">Return to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
