{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="super_container_inner" style="padding-top: 150px; padding-bottom: 100px; background: #f2f4f5;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card border-0 shadow-lg rounded-lg">
                    <div class="card-body p-5">
                        <h2 class="text-center font-weight-bold mb-4" style="color: #1a1a1a;">Login</h2>

                        {% include 'partials/messages.html' %}

                        <form method="POST" action="{% url 'login' %}">
                            {% csrf_token %}

                            <div class="form-group mb-3">
                                <label class="text-muted small">Username *</label>
                                <input type="text" name="username" class="form-control form-control-lg" placeholder="Enter username" required>
                            </div>

                            <div class="form-group mb-3">
                                <label class="text-muted small">Password *</label>
                                <input type="password" name="password" class="form-control form-control-lg" placeholder="Password" required>
                            </div>

                            <!-- REMEMBER ME & FORGOT PASSWORD BLOCK HERE -->
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check">
                                    <input type="checkbox" name="remember_me" class="form-check-input" id="rememberMeCheck">
                                    <label class="form-check-label text-muted small" for="rememberMeCheck">Remember me</label>
                                </div>
                                <div>
                                    <a href="{% url 'password_reset' %}" class="small text-primary text-decoration-none">Forgot password?</a>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-warning btn-block text-white font-weight-bold py-3" style="background-color: #fb297b; border: none; border-radius: 5px;">
                                Login
                            </button>

                            <div class="text-center mt-4">
                                <p class="mb-0 text-muted">Don't have an account? <a href="{% url 'register' %}" style="color: #fb297b;" class="font-weight-bold">Register here</a></p>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
