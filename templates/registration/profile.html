{% extends "base.html" %}

{% block content %}
<div class="container my-5" style="padding-top: 130px;">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0 p-4" style="background-color: #f8f9fa;">
                <h3 class="font-weight-bold mb-4 text-center">My Profile Setup</h3>

                <form method="POST" enctype="multipart/form-data" id="profile-form">
                    {% csrf_token %}

                    <div class="text-center mb-4">
                        {% if user.profile_picture %}
                            <img id="avatar-preview" src="{{ user.profile_picture.url }}" class="rounded-circle shadow-sm" style="width: 140px; height: 140px; object-fit: cover; border: 3px solid #ffb606;">
                        {% else %}
                            <img id="avatar-preview" src="https://via.placeholder.com/140" class="rounded-circle shadow-sm" style="width: 140px; height: 140px; object-fit: cover;">
                        {% endif %}
                    </div>

                    {{ form.as_p }}

                    <button type="submit" class="btn btn-warning btn-block font-weight-bold text-white mt-4" style="background-color: #ffb606; border: none;">
                        Save Profile Updates
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Interactive Circle Adjustment Modal -->
<div class="modal fade" id="adjustModal" tabindex="-1" role="dialog" aria-hidden="true" data-backdrop="static">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title font-weight-bold">Adjust & Position Face</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body text-center p-3">
                <p class="text-muted small mb-2">Mouse se image ko drag karein aur zoom slider se face adjust karein:</p>

                <div style="position: relative; width: 280px; height: 280px; margin: 0 auto; overflow: hidden; border-radius: 50%; border: 4px solid #ffb606; background: #000; cursor: move;">
                    <canvas id="cropCanvas" width="280" height="280" style="position: absolute; top:0; left:0;"></canvas>
                </div>

                <div class="mt-3 px-4">
                    <label class="small font-weight-bold">Zoom In / Out:</label>
                    <input type="range" id="zoomRange" class="custom-range" min="0.5" max="3" step="0.05" value="1">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-warning text-white font-weight-bold" id="applyAdjust" style="background-color: #ffb606; border: none;">Apply Picture</button>
            </div>
        </div>
    </div>
</div>

<script>
    const fileInput = document.querySelector('input[type="file"]');
    const avatarPreview = document.getElementById('avatar-preview');
    const canvas = document.getElementById('cropCanvas');
    const ctx = canvas.getContext('2d');
    const zoomRange = document.getElementById('zoomRange');

    let img = new Image();
    let scale = 1;
    let originX = 0;
    let originY = 0;
    let isDragging = false;
    let startX, startY;

    fileInput.addEventListener('change', function (e) {
        const files = e.target.files;
        if (files && files.length > 0) {
            const reader = new FileReader();
            reader.onload = function (event) {
                img.onload = function () {
                    // Initial centering setup
                    scale = Math.max(canvas.width / img.width, canvas.height / img.height);
                    zoomRange.value = scale;
                    zoomRange.min = scale * 0.5;
                    zoomRange.max = scale * 3;
                    originX = (canvas.width - img.width * scale) / 2;
                    originY = (canvas.height - img.height * scale) / 2;
                    draw();
                    $('#adjustModal').modal('show');
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(files[0]);
        }
    });

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, originX, originY, img.width * scale, img.height * scale);
    }

    // Zooming Controls
    zoomRange.addEventListener('input', function () {
        const newScale = parseFloat(this.value);
        originX -= (img.width * newScale - img.width * scale) / 2;
        originY -= (img.height * newScale - img.height * scale) / 2;
        scale = newScale;
        draw();
    });

    // Dragging Mouse Controls
    canvas.addEventListener('mousedown', function (e) {
        isDragging = true;
        startX = e.clientX - originX;
        startY = e.clientY - originY;
    });

    window.addEventListener('mousemove', function (e) {
        if (isDragging) {
            originX = e.clientX - startX;
            originY = e.clientY - startY;
            draw();
        }
    });

    window.addEventListener('mouseup', function () {
        isDragging = false;
    });

    // Apply & Create cropped file
    document.getElementById('applyAdjust').addEventListener('click', function () {
        canvas.toBlob(function (blob) {
            const file = new File([blob], "adjusted_profile.jpg", { type: "image/jpeg" });
            const dataTransfer = new DataTransfer();
            dataTransfer.items.add(file);
            fileInput.files = dataTransfer.files;

            avatarPreview.src = URL.createObjectURL(blob);
            $('#adjustModal').modal('hide');
        }, 'image/jpeg');
    });
</script>
{% endblock %}
