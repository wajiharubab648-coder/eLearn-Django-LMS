{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container py-5" style="margin-top: 100px;">
    <div class="row justify-content-center">
        <div class="col-md-6 col-xl-5">
            <div class="card border-0 shadow-sm p-4" style="border-radius: 12px;">
                <h3 class="font-weight-bold mb-4">Reset Password</h3>
                <p class="text-muted small">Enter your email address below and we'll send you a link to reset your password.</p>

                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn text-white font-weight-bold w-100 py-3 mt-3" style="background: linear-gradient(90deg, #5b5af7 0%, #a251f7 100%); border: none; border-radius: 6px;">
                        Send Confirmation Link &rarr;
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
