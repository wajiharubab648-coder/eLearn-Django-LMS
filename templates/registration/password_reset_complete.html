{% extends 'base.html' %}

{% block content %}
<div class="container py-5 text-center" style="margin-top: 120px; margin-bottom: 80px;">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm p-5" style="border-radius: 12px;">
                <h3 class="font-weight-bold text-success mb-3">Password Reset Complete</h3>
                <p class="text-muted mb-4">Your password has been set. You may now go ahead and log in.</p>
                <a href="{% url 'login' %}" class="btn text-white font-weight-bold px-4 py-3" style="background: linear-gradient(90deg, #5b5af7 0%, #a251f7 100%); border-radius: 6px;">
                    Log In Now
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
